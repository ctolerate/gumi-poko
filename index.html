<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Gumi × Poko</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   ROOT
===================================================== */

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050817;
}


/* =====================================================
   PERSISTENT MUSIC PLAYER
===================================================== */

#persistentMusic{

  position:fixed;

  right:22px;
  bottom:22px;

  z-index:999999;

  width:58px;
  height:58px;

  border-radius:50%;

  border:1px solid rgba(150,190,255,.28);

  background:
    linear-gradient(
      145deg,
      rgba(70,100,180,.35),
      rgba(20,25,60,.9)
    );

  color:white;

  display:grid;
  place-items:center;

  font-size:21px;

  cursor:pointer;

  box-shadow:
    0 12px 40px rgba(0,0,0,.45),
    0 0 30px rgba(80,130,255,.16);

  backdrop-filter:blur(15px);

  transition:.25s ease;

  user-select:none;
}

#persistentMusic:hover{
  transform:scale(1.08);
}

#persistentMusic.playing{

  box-shadow:
    0 12px 40px rgba(0,0,0,.45),
    0 0 45px rgba(100,150,255,.35);

}


/* =====================================================
   PAGE FRAME
===================================================== */

#pageFrame{

  width:100%;
  height:100%;

  border:0;

  display:block;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  #persistentMusic{

    width:52px;
    height:52px;

    right:14px;
    bottom:14px;

    font-size:19px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     ONE AND ONLY AUDIO
===================================================== -->

<audio
  id="loveSong"
  preload="auto"
>

  <source
    src="assets/i-think-they-call-this-love.mp3"
    type="audio/mpeg"
  >

</audio>


<!-- =====================================================
     PERMANENT MUSIC BUTTON
===================================================== -->

<button
  id="persistentMusic"
  type="button"
  aria-label="Play or pause our song"
>

  ▶

</button>


<!-- =====================================================
     ALL WEBSITE PAGES LIVE INSIDE THIS FRAME
===================================================== -->

<iframe
  id="pageFrame"
  src="home.html"
  title="Gumi × Poko"
></iframe>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const song =
  document.getElementById("loveSong");

const musicButton =
  document.getElementById("persistentMusic");

const frame =
  document.getElementById("pageFrame");


/* =====================================================
   LOCAL STORAGE
===================================================== */

const SONG_TIME_KEY =
  "gumiPokoSongTime";


/* =====================================================
   UPDATE MUSIC BUTTON
===================================================== */

function updateMusicButton(){

  if(song.paused){

    musicButton.textContent = "▶";

    musicButton.classList.remove("playing");

  }

  else{

    musicButton.textContent = "❚❚";

    musicButton.classList.add("playing");

  }

}


/* =====================================================
   PLAY
===================================================== */

async function playSong(){

  try{

    await song.play();

    updateMusicButton();

  }

  catch(error){

    console.log(
      "Browser blocked music:",
      error
    );

  }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseSong(){

  song.pause();

  updateMusicButton();

}


/* =====================================================
   MUSIC BUTTON
===================================================== */

musicButton.addEventListener(
  "click",
  function(){

    if(song.paused){

      playSong();

    }

    else{

      pauseSong();

    }

  }
);


/* =====================================================
   SAVE CURRENT POSITION
===================================================== */

function saveSongPosition(){

  try{

    localStorage.setItem(
      SONG_TIME_KEY,
      String(song.currentTime || 0)
    );

  }

  catch(error){}

}


song.addEventListener(
  "timeupdate",
  saveSongPosition
);


song.addEventListener(
  "pause",
  saveSongPosition
);


/* =====================================================
   RESTORE LAST POSITION
===================================================== */

try{

  const savedTime =
    parseFloat(
      localStorage.getItem(
        SONG_TIME_KEY
      )
    );

  if(
    Number.isFinite(savedTime) &&
    savedTime >= 0
  ){

    song.addEventListener(
      "loadedmetadata",
      function(){

        if(savedTime < song.duration){

          song.currentTime =
            savedTime;

        }

      },
      {once:true}
    );

  }

}

catch(error){}


/* =====================================================
   PAGE LOAD
===================================================== */

frame.addEventListener(
  "load",
  function(){

    cleanChildMusic();

    setupChildNavigation();

    setupHomePlayButton();

  }
);


/* =====================================================
   REMOVE OLD MUSIC SYSTEMS FROM CHILD PAGES
===================================================== */

function cleanChildMusic(){

  try{

    const doc =
      frame.contentDocument ||
      frame.contentWindow.document;


    /*
      Remove any audio element
      inside the child page.
    */

    const childAudios =
      doc.querySelectorAll("audio");

    childAudios.forEach(
      function(audio){

        audio.pause();

        audio.remove();

      }
    );


    /*
      Remove old music players.
    */

    const selectors = [

      "#songPlayer",

      "#songButton",

      "#loveStart",

      ".songPlayer",

      ".musicPlayer",

      ".musicButton",

      "[id*='songPlayer']",

      "[id*='musicPlayer']"

    ];


    selectors.forEach(
      function(selector){

        doc
          .querySelectorAll(selector)
          .forEach(
            function(element){

              /*
                Don't remove loveStart here.
                It gets handled separately below.
              */

              if(element.id !== "loveStart"){

                element.remove();

              }

            }
          );

      }
    );


    /*
      Hide old music UI if any remains.
    */

    const oldPlayers =
      doc.querySelectorAll(
        ".songPlayer"
      );

    oldPlayers.forEach(
      function(player){

        player.remove();

      }
    );

  }

  catch(error){

    console.log(
      "Could not clean child music:",
      error
    );

  }

}


/* =====================================================
   HOME PAGE "PLAY OUR SONG" BUTTON
===================================================== */

function setupHomePlayButton(){

  try{

    const doc =
      frame.contentDocument ||
      frame.contentWindow.document;


    const oldStart =
      doc.getElementById(
        "loveStart"
      );


    if(!oldStart){

      return;

    }


    /*
      Clone the button.

      This removes the old home.html
      click listener which was trying
      to control its own audio.
    */

    const newStart =
      oldStart.cloneNode(true);


    oldStart.replaceWith(
      newStart
    );


    newStart.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        playSong();

        /*
          Hide the intro just like
          the original button did.
        */

        const intro =
          doc.getElementById(
            "loveIntro"
          );

        if(intro){

          intro.classList.add(
            "loveIntroHide"
          );

        }

      }
    );

  }

  catch(error){

    console.log(
      "Home music setup error:",
      error
    );

  }

}


/* =====================================================
   CHILD PAGE NAVIGATION
===================================================== */

function setupChildNavigation(){

  try{

    const doc =
      frame.contentDocument ||
      frame.contentWindow.document;


    /*
      Add persistent-shell class.
    */

    doc.documentElement.classList.add(
      "insidePersistentShell"
    );


    /*
      Intercept internal links.
      They stay inside the iframe.
    */

    doc.addEventListener(
      "click",
      function(event){

        const link =
          event.target.closest("a");


        if(!link){

          return;

        }


        const href =
          link.getAttribute("href");


        if(!href){

          return;

        }


        /*
          External links remain normal.
        */

        if(
          href.startsWith("http://") ||
          href.startsWith("https://") ||
          href.startsWith("mailto:") ||
          href.startsWith("#")
        ){

          return;

        }


        /*
          If a page points to index.html,
          keep the user inside the shell.
        */

        if(
          href === "index.html" ||
          href === "./index.html"
        ){

          event.preventDefault();

          frame.src =
            "home.html";

          return;

        }


        /*
          Normal internal page.
          It loads inside the iframe.
        */

        if(
          href.endsWith(".html")
        ){

          event.preventDefault();

          frame.src =
            href;

        }

      },
      true
    );

  }

  catch(error){

    console.log(
      "Navigation setup error:",
      error
    );

  }

}


/* =====================================================
   SONG ENDED
===================================================== */

song.addEventListener(
  "ended",
  function(){

    song.currentTime = 0;

    localStorage.setItem(
      SONG_TIME_KEY,
      "0"
    );

    updateMusicButton();

  }
);


/* =====================================================
   INITIAL BUTTON STATE
===================================================== */

updateMusicButton();


/* =====================================================
   SAVE BEFORE LEAVING
===================================================== */

window.addEventListener(
  "pagehide",
  saveSongPosition
);

</script>


</body>

</html>
