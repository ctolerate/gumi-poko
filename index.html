<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Gumi × Poko</title>

<link rel="stylesheet" href="style.css">

<style>

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#050817;
}

/* =========================
   PERSISTENT MUSIC PLAYER
========================= */

#persistentMusic{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:999999;

  width:58px;
  height:58px;

  border-radius:50%;

  border:1px solid rgba(150,190,255,.28);

  background:
    linear-gradient(
      145deg,
      rgba(70,100,180,.35),
      rgba(20,25,60,.85)
    );

  color:white;

  display:grid;
  place-items:center;

  font-size:21px;

  cursor:pointer;

  box-shadow:
    0 12px 40px rgba(0,0,0,.45),
    0 0 30px rgba(80,130,255,.16);

  backdrop-filter:blur(15px);

  transition:.25s ease;
}

#persistentMusic:hover{
  transform:scale(1.08);
}

#persistentMusic.playing{
  box-shadow:
    0 12px 40px rgba(0,0,0,.45),
    0 0 45px rgba(100,150,255,.35);
}

/* =========================
   PAGE FRAME
========================= */

#pageFrame{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #persistentMusic{
    width:52px;
    height:52px;

    right:14px;
    bottom:14px;

    font-size:19px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     PERSISTENT AUDIO
===================================================== -->

<audio
  id="loveSong"
  preload="auto"
>

  <source
    src="assets/i-think-they-call-this-love.mp3"
    type="audio/mpeg"
  >

</audio>


<!-- =====================================================
     MUSIC BUTTON
===================================================== -->

<button
  id="persistentMusic"
  type="button"
  aria-label="Play or pause our song"
>

  ▶

</button>


<!-- =====================================================
     WEBSITE PAGES
===================================================== -->

<iframe
  id="pageFrame"
  src="home.html"
  title="Gumi × Poko"
></iframe>


<script>

/* =====================================================
   MUSIC
===================================================== */

const song =
  document.getElementById("loveSong");

const musicButton =
  document.getElementById("persistentMusic");


let isPlaying = false;


/* Play */

async function playSong(){

  try{

    await song.play();

    isPlaying = true;

    musicButton.textContent = "❚❚";

    musicButton.classList.add("playing");

  }

  catch(error){

    console.log(
      "Browser blocked autoplay until user interaction."
    );

  }

}


/* Pause */

function pauseSong(){

  song.pause();

  isPlaying = false;

  musicButton.textContent = "▶";

  musicButton.classList.remove("playing");

}


/* Button */

musicButton.addEventListener(
  "click",
  function(){

    if(song.paused){

      playSong();

    }else{

      pauseSong();

    }

  }
);


/* =====================================================
   SAVE MUSIC STATE
===================================================== */

song.addEventListener(
  "timeupdate",
  function(){

    try{

      localStorage.setItem(
        "gumiPokoSongTime",
        song.currentTime
      );

    }catch(e){}

  }
);


/* Restore position */

try{

  const savedTime =
    localStorage.getItem(
      "gumiPokoSongTime"
    );

  if(savedTime){

    song.currentTime =
      parseFloat(savedTime);

  }

}catch(e){}


/* =====================================================
   PAGE NAVIGATION INSIDE IFRAME
===================================================== */

const frame =
  document.getElementById("pageFrame");


frame.addEventListener(
  "load",
  function(){

    try{

      const doc =
        frame.contentDocument ||
        frame.contentWindow.document;


      doc.addEventListener(
        "click",
        function(event){

          const link =
            event.target.closest("a");

          if(!link){
            return;
          }


          const href =
            link.getAttribute("href");

          if(!href){
            return;
          }


          /*
            Keep external links normal.
          */

          if(
            href.startsWith("http://") ||
            href.startsWith("https://") ||
            href.startsWith("#") ||
            href.startsWith("mailto:")
          ){

            return;

          }


          /*
            IMPORTANT:
            If any page points to index.html,
            send it to home.html instead.
          */

          if(
            href === "index.html" ||
            href === "./index.html"
          ){

            event.preventDefault();

            frame.src = "home.html";

          }

        }
      );


      /*
        Tell the child page that it is
        running inside the persistent shell.
      */

      doc.documentElement.classList.add(
        "insidePersistentShell"
      );


    }catch(error){

      console.log(
        "Frame navigation setup error:",
        error
      );

    }

  }
);


/* =====================================================
   START SONG AFTER USER INTERACTION
===================================================== */

document.addEventListener(
  "click",
  function(){

    /*
      Do NOT force autoplay immediately.

      First click anywhere on the website
      is allowed to start the song.
    */

    if(song.paused){

      playSong();

    }

  },
  { once:true }
);

</script>


</body>

</html>
